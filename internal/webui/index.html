<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f59e0b' fill-opacity='0.12'/%3E%3Cpath d='M6 22V10c0-1.1.9-2 2-2h5l2 2h9c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H8c-1.1 0-2-.9-2-2z' stroke='%23f59e0b' stroke-width='1.5' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M6 10h5l2 2' stroke='%23f59e0b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M16 13l1.3 2.7 3 .5-2.2 2 .5 3L16 19.5l-2.6 1.7.5-3-2.2-2 3-.5L16 13z' fill='%23f59e0b' opacity='0.9'/%3E%3C/svg%3E">
<title>ODK — Open Directory Observatory</title>
<style>
:root{--bg:#050508;--surface:#0a0a16;--elevated:#12121e;--border:rgba(255,255,255,0.06);--text:#e4e4f0;--muted:#7a7a92;--gold:#f59e0b;--amber:#f97316;--cyan:#06b6d4;--violet:#a78bfa;--emerald:#34d399;--pink:#f472b6;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro','Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(245,158,11,0.06),transparent);pointer-events:none;z-index:0}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0;animation:twinkle var(--d) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:var(--o,0.3)}}
nav{position:sticky;top:0;z-index:50;background:rgba(5,5,8,0.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;height:56px;gap:4px}
nav .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--gold);margin-right:16px;text-decoration:none;flex-shrink:0}
nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:500;letter-spacing:0.2px;transition:all .2s;cursor:pointer;white-space:nowrap}
nav a:hover,nav a.active{color:var(--text);background:rgba(255,255,255,0.06)}
.live-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap;display:flex;align-items:center;gap:6px;flex-shrink:0}
.live-btn:hover{border-color:var(--emerald);color:var(--emerald)}
.live-btn.active{border-color:var(--emerald);color:var(--emerald);background:rgba(52,211,153,0.08)}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--emerald);animation:livePulse 2s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.85)}}
#nav-status{font-size:11px;color:var(--muted);white-space:nowrap;margin-left:8px;flex-shrink:0}
@media(max-width:720px){nav{padding:0 12px;gap:2px;overflow-x:auto}nav a{padding:6px 8px;font-size:12px}.live-btn{font-size:11px;padding:4px 10px}#nav-status{display:none}}
main{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:28px 20px 80px}
.page{display:none;animation:fadeIn .4s ease}
.page.active{display:block}
.page.refreshing{opacity:0.5;transition:opacity .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes countUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:1fr 1fr 1fr}
.grid-2-1{grid-template-columns:2fr 1fr}
.card{background:var(--elevated);border:1px solid var(--border);border-radius:var(--radius);padding:24px;animation:slideUp .5s ease both}
.card-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:16px}
.stat-group{display:flex;gap:16px;flex-wrap:wrap}
.stat{flex:1;min-width:160px;padding:20px 24px;background:rgba(255,255,255,0.02);border-radius:10px;border:1px solid var(--border)}
.stat-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.stat-value{font-size:36px;font-weight:700;line-height:1.2;margin-top:4px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.stat-value.gold{color:var(--gold)}
.stat-value.cyan{color:var(--cyan)}
.stat-value.emerald{color:var(--emerald)}
.stat-value.violet{color:var(--violet)}
.stat-sub{font-size:13px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;line-height:1}
.bar-group{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:12px}
.bar-label{width:80px;font-size:12px;color:var(--muted);text-align:right;flex-shrink:0}
.bar-track{flex:1;height:20px;background:rgba(255,255,255,0.04);border-radius:4px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:4px;transition:width 1s ease;min-width:2px}
.bar-count{font-size:12px;color:var(--muted);width:60px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.treemap{display:flex;flex-wrap:wrap;gap:4px}
.treemap-item{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;padding:8px;font-size:11px;font-weight:600;color:#fff;min-height:60px;transition:all .2s;cursor:default}
.treemap-item:hover{transform:scale(1.03);z-index:2}
.treemap-item .count{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.tag-cloud{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.tag{display:inline-block;padding:6px 12px;border-radius:20px;font-size:var(--s,13px);font-weight:500;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text);transition:all .15s;cursor:default}
.tag:hover{background:rgba(245,158,11,0.12);border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
.table-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 12px;text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.03);max-width:350px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:hover td{background:rgba(255,255,255,0.02)}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filter-pill{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s}
.filter-pill:hover{background:rgba(255,255,255,0.08);color:var(--text)}
.filter-pill.active{background:rgba(245,158,11,0.12);border-color:var(--gold);color:var(--gold)}
.search-box{display:flex;gap:12px;margin-bottom:16px}
.search-box input{flex:1;padding:12px 16px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);font-size:14px;outline:none;transition:border .2s}
.search-box input:focus{border-color:var(--gold)}
.search-box input::placeholder{color:var(--muted)}
.search-box select{padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);font-size:13px;outline:none}
.search-box button{padding:12px 28px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--gold),var(--amber));color:#000;font-weight:600;font-size:13px;cursor:pointer;transition:opacity .2s}
.search-box button:hover{opacity:.9}
.pagination{display:flex;gap:8px;align-items:center}
.pagination button{padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);cursor:pointer;font-size:12px;transition:all .15s}
.pagination button:hover:not(:disabled){background:rgba(255,255,255,0.1)}
.pagination button:disabled{opacity:.3;cursor:default}
.pagination button.current{background:rgba(245,158,11,0.12);border-color:var(--gold);color:var(--gold)}
.pagination span{font-size:12px;color:var(--muted)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 0;color:var(--muted);font-size:13px;gap:12px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.hidden{display:none}
a{color:var(--cyan);text-decoration:none}
a:hover{text-decoration:underline}
.copy-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 6px;font-size:12px;border-radius:4px;opacity:0;transition:all .15s}
tr:hover .copy-btn{opacity:1}
.copy-btn:hover{background:rgba(255,255,255,0.08);color:var(--text)}
.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.badge-audio{background:rgba(6,182,212,0.15);color:var(--cyan)}
.badge-video{background:rgba(167,139,250,0.15);color:var(--violet)}
.badge-image{background:rgba(52,211,153,0.15);color:var(--emerald)}
.badge-document{background:rgba(245,158,11,0.15);color:var(--gold)}
.badge-archive{background:rgba(244,114,182,0.15);color:var(--pink)}
.badge-code{background:rgba(6,182,212,0.15);color:var(--cyan)}
.badge-other{background:rgba(255,255,255,0.06);color:var(--muted)}
@media(max-width:800px){.grid-2,.grid-3,.grid-2-1{grid-template-columns:1fr}.stat-value{font-size:28px}.stat{min-width:120px}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<nav>
  <a class="logo" href="/"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="1" y="1" width="22" height="22" rx="5" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.2" fill="none"/><path d="M4 17V7c0-.8.7-1.5 1.5-1.5h4l1.5 1.5H18c.8 0 1.5.7 1.5 1.5v8c0 .8-.7 1.5-1.5 1.5H5.5c-.8 0-1.5-.7-1.5-1.5z" stroke="#f59e0b" stroke-width="1.3" stroke-linejoin="round"/><path d="M4 7.5h4l1.5 1.5" stroke="#f59e0b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 9.5l1 2 2.3.4-1.7 1.5.4 2.2L12 14l-2 1.6.4-2.2-1.7-1.5 2.3-.4 1-2z" fill="#f59e0b" opacity="0.85"/></svg>ODK</a>
  <a href="#" class="active" onclick="return showPage('dash',this)">Dashboard</a>
  <a href="#" onclick="return showPage('browse',this)">Dizinler</a>
  <a href="#" onclick="return showPage('files',this)">Dosyalar</a>
  <a href="#" onclick="return showPage('search',this)">Arama</a>
  <a href="#" onclick="return showPage('analysis',this)">Analiz</a>
  <span style="flex:1;min-width:8px"></span>
  <button id="liveBtn" class="live-btn" onclick="toggleLive()" title="30sn otomatik yenile"><span class="live-dot" style="display:none"></span>○ Canlı</button>
  <span id="nav-status"></span>
</nav>
<main>
<div id="page-dash" class="page active"></div>
<div id="page-browse" class="page"></div>
<div id="page-files" class="page"></div>
<div id="page-search" class="page"></div>
<div id="page-analysis" class="page"></div>
</main>
<script>
const API=''
let state={dirs:[],dirOffset:0,fileOffset:0,fileTotal:0,fileCat:'',fileExt:''}
let liveInterval=null,currentPage='dash'

function $(s){return document.querySelector(s)}
function $$(s){return document.querySelectorAll(s)}

function stars(){
  const c=document.getElementById('stars')
  for(let i=0;i<120;i++){
    const s=document.createElement('div');s.className='star'
    s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%'
    s.style.setProperty('--d',(2+Math.random()*4)+'s');s.style.setProperty('--o',(0.1+Math.random()*0.4))
    s.style.width=s.style.height=(1+Math.random()*2)+'px'
    c.appendChild(s)
  }
}
stars()

function fmt(b){if(!b)return'0 B';const u=['B','KB','MB','GB','TB'];let i=0,s=b;while(s>=1024&&i<u.length-1){s/=1024;i++}return s.toFixed(i>0?1:0)+' '+u[i]}
function badge(c){return`<span class="badge badge-${c}">${c}</span>`}

async function api(p){const r=await fetch(API+p);if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||r.statusText)}return r.json()}
async function apiMeta(p){const r=await fetch(API+p);if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||r.statusText)}const total=parseInt(r.headers.get('X-Total-Count')||'0');const data=await r.json();return{data,total}}

function copy(t){navigator.clipboard.writeText(t).then(()=>toast('Kopyalandı'))}
function toast(m){const t=document.createElement('div');t.style.cssText='position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;background:var(--elevated);border:1px solid var(--border);color:var(--text);font-size:13px;z-index:100;animation:fadeIn .2s';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

function showPage(name,el){
  currentPage=name
  $$('.page').forEach(p=>p.classList.remove('active'))
  $$('nav a').forEach(a=>a.classList.remove('active'))
  const page=document.getElementById('page-'+name);if(page)page.classList.add('active')
  if(el)el.classList.add('active')
  const fns={dash:loadDash,browse:loadDirs,files:loadFiles,search:loadSearch,analysis:loadAnalysis}
  if(fns[name])fns[name]()
  return false
}

function toggleLive(){
  const btn=document.getElementById('liveBtn'),dot=btn.querySelector('.live-dot')
  if(liveInterval){
    clearInterval(liveInterval);liveInterval=null
    btn.innerHTML='○ Canlı';btn.classList.remove('active');dot.style.display='none'
  }else{
    dot.style.display='inline-block'
    btn.innerHTML='<span class="live-dot"></span> Canlı';btn.classList.add('active')
    liveInterval=setInterval(()=>{
      const el=document.getElementById('page-'+currentPage);if(el)el.classList.add('refreshing')
      const fns={dash:loadDash,browse:loadDirs,files:loadFiles,search:loadSearch,analysis:loadAnalysis}
      if(fns[currentPage])fns[currentPage](true)
      setTimeout(()=>{if(el)el.classList.remove('refreshing')},600)
    },30000)
  }
}

async function updateNavStatus(){
  try{
    const s=await api('/stats')
    document.getElementById('nav-status').textContent=`${(s.total_directories/1000).toFixed(0)}k diz · ${(s.total_files/1000).toFixed(0)}k dos · ${fmt(s.total_size)}`
  }catch(e){}
}

function animateValue(el,target,suffix='',duration=900){
  const start=performance.now()
  const fmtNum=n=>{if(typeof target==='string')return target;return n.toLocaleString()}
  function update(now){
    const t=Math.min((now-start)/duration,1)
    const val=Math.round(target*(1-Math.pow(1-t,3)))
    el.textContent=fmtNum(val)+suffix
    if(t<1)requestAnimationFrame(update);else el.textContent=fmtNum(target)+suffix
  }
  requestAnimationFrame(update)
}

// ─── DASHBOARD ─────────────────────────────────────────

async function loadDash(refresh){
  const el=document.getElementById('page-dash')
  el._loaded=true
  if(!refresh)el.innerHTML='<div class="loading"><div class="spinner"></div></div>'
  try{
    const[stats,analysis]=await Promise.all([api('/stats'),api('/stats/analysis').catch(()=>null)])
    const cats=stats.category_counts||{}
    const topExts=Object.entries(stats.ext_counts||{}).sort((a,b)=>b[1]-a[1]).slice(0,10)
    const tlds=analysis?.tld_stats||{}
    const catColors={audio:'#06b6d4',video:'#a78bfa',image:'#34d399',document:'#f59e0b',archive:'#f472b6',code:'#06b6d4',torrent:'#f87171',executable:'#fb923c',other:'#6b7280'}
    const catEntries=Object.entries(cats).sort((a,b)=>b[1]-a[1])
    const totalCat=Object.values(cats).reduce((a,b)=>a+b,0)
    let treemapHtml='',used=0
    for(const[k,v]of catEntries){
      const pct=totalCat>0?(v/totalCat*100):0
      const flex=v/Math.max(...Object.values(cats))||1
      const c=catColors[k]||'#6b7280'
      if(pct<2&&catEntries.length>4){used=v;continue}
      treemapHtml+=`<div class="treemap-item" style="flex:${flex};background:${c}22;border:1px solid ${c}44;color:${c}"><span class="count">${v.toLocaleString()}</span><span>${k}</span></div>`
    }
    if(used>0)treemapHtml+=`<div class="treemap-item" style="flex:0.2;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--muted);font-size:10px"><span class="count">${used.toLocaleString()}</span><span>other</span></div>`
    const tldEntries=Object.entries(tlds).filter(([_,i])=>i.files>0).sort((a,b)=>b[1].files-a[1].files).slice(0,8)
    const maxTldFiles=Math.max(...tldEntries.map(([_,i])=>i.files),1)

    el.innerHTML=`
      <div class="stat-group" style="margin-bottom:16px">
        <div class="stat"><div class="stat-label">Dizin</div><div class="stat-value gold" id="stat-dirs">0</div><div class="stat-sub">toplam dizin</div></div>
        <div class="stat"><div class="stat-label">Dosya</div><div class="stat-value cyan" id="stat-files">0</div><div class="stat-sub" id="stat-files-sub">0 dosya/dizin</div></div>
        <div class="stat"><div class="stat-label">Boyut</div><div class="stat-value emerald" id="stat-size">0 B</div><div class="stat-sub" id="stat-size-sub">0 B/dosya</div></div>
        <div class="stat"><div class="stat-label">Keyword</div><div class="stat-value violet" id="stat-kw">0</div><div class="stat-sub">benzersiz kelime</div></div>
      </div>
      <div class="grid grid-2" style="margin-bottom:16px">
        <div class="card"><div class="card-title">Kategori Dağılımı</div><div class="treemap">${treemapHtml}</div></div>
        <div class="card"><div class="card-title">En Çok Uzantı</div>${topExts.map(([k,v])=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px"><span style="color:var(--muted)">.${k}</span><span class="pill" style="background:rgba(255,255,255,0.06);color:var(--text);font-size:11px">${v.toLocaleString()}</span></div>`).join('')}</div>
      </div>
      <div class="grid grid-2-1" style="margin-bottom:16px">
        <div class="card"><div class="card-title">TLD Dağılımı</div><div class="bar-group">${tldEntries.map(([tld,info])=>{const pct=info.files/maxTldFiles*100;return`<div class="bar-row"><span class="bar-label">.${tld}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:linear-gradient(90deg,var(--gold),var(--amber));opacity:${0.3+pct/100*0.7}"></div></div><span class="bar-count">${info.files.toLocaleString()}</span></div>`}).join('')}</div></div>
        <div class="card"><div class="card-title">Edu</div>${analysis?.edu_breakdown?.total_files?`<div style="text-align:center;padding:12px 0"><div style="font-size:32px;font-weight:700;color:var(--emerald)">${analysis.edu_breakdown.total_files.toLocaleString()}</div><div style="font-size:12px;color:var(--muted)">dosya (${(analysis.edu_breakdown.total_files/stats.total_files*100).toFixed(1)}%)</div></div><div style="margin-top:8px">${Object.entries(analysis.edu_breakdown.categories||{}).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([c,n])=>`<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span style="color:var(--muted)">${c}</span><span>${n.toLocaleString()}</span></div>`).join('')}</div>`:'<div class="empty">Veri yok</div>'}</div>
      </div>
      <div class="card"><div class="card-title">Öne Çıkan Keywordler</div>${analysis?.keywords?.length?(()=>{const kw=analysis.keywords.slice(0,80);const maxCount=Math.max(...kw.map(k=>k.count));return'<div class="tag-cloud">'+kw.map(k=>{const s=11+((k.count/maxCount)*14);const o=0.4+((k.count/maxCount)*0.6);return`<span class="tag" style="font-size:${s}px;opacity:${o}">${k.word}</span>`}).join('')+'</div>'})():'<div class="empty">Keyword verisi yok. Agent derinlemesine tarama tamamlayınca gelir.</div>'}</div>`

    animateValue(document.getElementById('stat-dirs'),stats.total_directories)
    animateValue(document.getElementById('stat-files'),stats.total_files)
    document.getElementById('stat-files-sub').textContent=stats.total_directories>0?(stats.total_files/stats.total_directories).toFixed(1)+' dosya/dizin':'0 dosya/dizin'
    const sizeEl=document.getElementById('stat-size');const sizeTarget=fmt(stats.total_size);sizeEl.textContent=sizeTarget
    document.getElementById('stat-size-sub').textContent=stats.total_files>0?fmt(stats.total_size/stats.total_files)+'/dosya':'0 B/dosya'
    if(analysis?.keywords?.length)animateValue(document.getElementById('stat-kw'),analysis.keywords.length)
  }catch(e){if(!refresh)el.innerHTML=`<div class="empty">Hata: ${e.message}</div>`}
}

// ─── DIRS ───────────────────────────────────────────────

async function loadDirs(refresh){
  const el=document.getElementById('page-browse')
  if(!refresh)el.innerHTML='<div class="loading"><div class="spinner"></div>Yükleniyor...</div>'
  try{
    const dirs=await api('/dirs?limit=100&offset='+state.dirOffset)
    state.dirs=dirs
    el.innerHTML=`
      <div class="card" style="padding:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:12px">
            <span class="card-title" style="margin:0">Dizinler</span>
            <span class="pill" style="background:rgba(255,255,255,0.06);font-size:11px">${state.dirOffset+1}-${state.dirOffset+dirs.length}</span>
          </div>
          <div class="pagination">
            <button onclick="dirPage(-1)" ${state.dirOffset===0?'disabled':''}>‹</button>
            <span>${state.dirOffset+1}-${state.dirOffset+dirs.length}</span>
            <button onclick="dirPage(1)" ${dirs.length<100?'disabled':''}>›</button>
          </div>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th style="width:40px">#</th><th>Durum</th><th>URL</th><th style="text-align:right">Dosya</th><th style="text-align:right">Boyut</th></tr></thead>
          <tbody>${dirs.map((d,i)=>`<tr>
            <td style="color:var(--muted);font-size:11px">${state.dirOffset+i+1}</td>
            <td>${d.status==='done'?'<span style="color:var(--emerald)">●</span>':d.status==='error'?'<span style="color:#f87171">●</span>':'<span style="color:var(--gold)">◌</span>'}</td>
            <td><a href="${d.url}" target="_blank" title="${d.url}">${d.url.length>55?d.url.slice(0,55)+'…':d.url}</a></td>
            <td style="text-align:right;font-variant-numeric:tabular-nums">${(d.file_count||0).toLocaleString()}</td>
            <td style="text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)">${fmt(d.total_size)}</td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>`
  }catch(e){if(!refresh)el.innerHTML=`<div class="empty">Hata: ${e.message}</div>`}
}

function dirPage(d){state.dirOffset=Math.max(0,state.dirOffset+d*100);loadDirs()}

// ─── FILES ───────────────────────────────────────────────

async function loadFiles(refresh){
  const el=document.getElementById('page-files')
  if(!refresh)el.innerHTML='<div class="loading"><div class="spinner"></div>Yükleniyor...</div>'
  try{
    const params=new URLSearchParams({limit:100,offset:state.fileOffset})
    if(state.fileCat)params.set('cat',state.fileCat)
    if(state.fileExt)params.set('ext',state.fileExt)
    const{data:files,total}=await apiMeta('/files?'+params.toString())
    state.fileTotal=total
    const totalPages=Math.ceil(total/100)
    const curPage=Math.floor(state.fileOffset/100)+1
    el.innerHTML=`
      <div class="card" style="padding:20px">
        <div class="card-title" style="margin-bottom:16px">Dosyalar</div>
        <div class="filter-pills">
          ${['','audio','video','image','document','archive','code'].map(c=>`<span class="filter-pill${state.fileCat===c?' active':''}" onclick="setFileCat('${c}')">${c||'Tümü'}</span>`).join('')}
        </div>
        <div style="display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap">
          <input type="text" id="fileExt" placeholder="Uzantı (örn: pdf,mp4)" value="${state.fileExt}" style="flex:0 1 160px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);font-size:13px;outline:none">
          <button onclick="filterFiles()" style="padding:8px 18px;border-radius:6px;border:none;background:linear-gradient(135deg,var(--gold),var(--amber));color:#000;font-weight:600;font-size:12px;cursor:pointer;transition:opacity .2s">Filtrele</button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
          <span style="font-size:12px;color:var(--muted)">${total.toLocaleString()} dosya · ${state.fileOffset+1}-${Math.min(state.fileOffset+files.length,total)}</span>
          <div class="pagination">
            <button onclick="filePage(-1)" ${state.fileOffset===0?'disabled':''}>‹</button>
            ${(()=>{
              let h=''
              if(totalPages<=7){
                for(let i=1;i<=totalPages;i++)h+=`<button class="${i===curPage?'current':''}" onclick="filePageTo(${i})">${i}</button>`
              }else{
                h+=`<button class="${1===curPage?'current':''}" onclick="filePageTo(1)">1</button>`
                if(curPage>3)h+='<span>…</span>'
                for(let i=Math.max(2,curPage-1);i<=Math.min(totalPages-1,curPage+1);i++)h+=`<button class="${i===curPage?'current':''}" onclick="filePageTo(${i})">${i}</button>`
                if(curPage<totalPages-2)h+='<span>…</span>'
                h+=`<button class="${totalPages===curPage?'current':''}" onclick="filePageTo(${totalPages})">${totalPages}</button>`
              }
              return h
            })()}
            <button onclick="filePage(1)" ${state.fileOffset+files.length>=total?'disabled':''}>›</button>
          </div>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th style="width:36px">#</th><th>Dosya</th><th style="width:44px">Ext</th><th style="text-align:right;width:90px">Boyut</th><th style="width:80px">Kategori</th><th>Dizin</th></tr></thead>
          <tbody>${files.map((f,i)=>`<tr>
            <td style="color:var(--muted);font-size:11px">${state.fileOffset+i+1}</td>
            <td><a href="${f.url}" target="_blank" title="${f.url}">${f.name.length>45?f.name.slice(0,45)+'…':f.name}</a> <button class="copy-btn" onclick="copy('${f.url.replace(/'/g,"\\'")}')">⎘</button></td>
            <td><span class="pill" style="background:rgba(255,255,255,0.06);font-size:10px">${f.ext||'?'}</span></td>
            <td style="text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)">${fmt(f.size)}</td>
            <td>${badge(f.category)}</td>
            <td style="font-size:11px;color:var(--muted);max-width:200px" title="${f.parent_url||''}">${f.parent_url&&f.parent_url.length>30?f.parent_url.slice(0,30)+'…':f.parent_url||''}</td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>`
  }catch(e){if(!refresh)el.innerHTML=`<div class="empty">Hata: ${e.message}</div>`}
}

function setFileCat(cat){state.fileCat=cat;state.fileOffset=0;loadFiles()}
function filterFiles(){state.fileExt=document.getElementById('fileExt').value.trim().toLowerCase();state.fileOffset=0;loadFiles()}
function filePage(d){state.fileOffset=Math.max(0,state.fileOffset+d*100);loadFiles()}
function filePageTo(p){state.fileOffset=(p-1)*100;loadFiles()}

// ─── SEARCH ─────────────────────────────────────────────

function loadSearch(refresh){
  const el=document.getElementById('page-search')
  if(!refresh||!el.querySelector('.search-box'))el.innerHTML=`
    <div class="card">
      <div class="card-title">Dosya Ara</div>
      <div class="search-box">
        <input type="text" id="sq" placeholder="Dosya adında ara..." onkeydown="if(event.key==='Enter')doSearch()">
        <select id="sc"><option value="">Tümü</option><option value="audio">Audio</option><option value="video">Video</option><option value="image">Image</option><option value="document">Document</option><option value="archive">Archive</option><option value="code">Code</option></select>
        <button onclick="doSearch()">Ara</button>
      </div>
      <div id="sr"></div>
    </div>`
  if(!refresh)setTimeout(()=>document.getElementById('sq').focus(),100)
}

async function doSearch(){
  const q=document.getElementById('sq').value.trim(),c=document.getElementById('sc').value
  if(!q)return
  const el=document.getElementById('sr')
  el.innerHTML='<div class="loading"><div class="spinner"></div></div>'
  try{
    const res=await api('/search?q='+encodeURIComponent(q)+(c?'&cat='+c:'')+'&limit=200')
    el.innerHTML=`
      <div style="margin-top:16px;margin-bottom:12px;font-size:13px;color:var(--muted)">${res.length} sonuç</div>
      ${res.length?`<div class="table-wrap"><table><thead><tr><th>Dosya</th><th>Kategori</th><th>Boyut</th><th>Dizin</th></tr></thead>
      <tbody>${res.map(r=>`<tr>
        <td><a href="${r.file.url}" target="_blank" title="${r.file.url}">${r.file.name.length>50?r.file.name.slice(0,50)+'…':r.file.name}</a> <button class="copy-btn" onclick="copy('${r.file.url.replace(/'/g,"\\'")}')">⎘</button></td>
        <td>${badge(r.file.category)}</td>
        <td style="font-variant-numeric:tabular-nums">${fmt(r.file.size)}</td>
        <td style="font-size:12px;color:var(--muted);max-width:250px" title="${r.directory_url}">${r.directory_url.length>35?r.directory_url.slice(0,35)+'…':r.directory_url}</td>
      </tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sonuç bulunamadı</div>'}`
  }catch(e){el.innerHTML=`<div class="empty">Hata: ${e.message}</div>`}
}

// ─── ANALYSIS ───────────────────────────────────────────

async function loadAnalysis(refresh){
  const el=document.getElementById('page-analysis')
  if(!refresh)el.innerHTML='<div class="loading"><div class="spinner"></div>Analiz yükleniyor...</div>'
  try{
    const report=await api('/stats/analysis')
    const sizeBuckets=report.size_buckets||{}
    const catSize=report.cat_size_buckets||{}
    const domains=report.top_domains||[]
    const sizeLabels=['<1KB','1-10KB','10-100KB','100KB-1MB','1-10MB','10-100MB','>100MB']
    const maxSizeVal=Math.max(...Object.values(sizeBuckets),1)
    el.innerHTML=`
      <div class="grid grid-3" style="margin-bottom:16px">
        <div class="stat"><div class="stat-label">Ort. dosya/dizin</div><div class="stat-value gold">${report.avg_files_per_dir?.toFixed(2)||'—'}</div></div>
        <div class="stat"><div class="stat-label">Benzersiz keyword</div><div class="stat-value cyan">${(report.keywords?.length||0).toLocaleString()}</div></div>
        <div class="stat"><div class="stat-label">TLD sayısı</div><div class="stat-value emerald">${Object.keys(report.tld_stats||{}).length}</div></div>
      </div>
      <div class="grid grid-2" style="margin-bottom:16px">
        <div class="card"><div class="card-title">Boyut Dağılımı</div><div class="bar-group">${sizeLabels.map(l=>{const v=sizeBuckets[l]||0;const p=v/maxSizeVal*100;return v>0?`<div class="bar-row"><span class="bar-label">${l}</span><div class="bar-track"><div class="bar-fill" style="width:${p}%;background:linear-gradient(90deg,var(--violet),var(--pink));opacity:${0.3+p/100*0.7}"></div></div><span class="bar-count">${(v).toLocaleString()}</span></div>`:''}).join('')}</div></div>
        <div class="card"><div class="card-title">Domain (en çok dosya)</div>${domains.slice(0,12).map(d=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px"><span style="color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px">${d.domain}</span><span style="font-variant-numeric:tabular-nums">${d.count.toLocaleString()}</span></div>`).join('')}${domains.length===0?'<div class="empty">Veri yok</div>':''}</div>
      </div>
      <div class="card"><div class="card-title">Kategori × Boyut Matrisi</div><div class="table-wrap"><table>
        <thead><tr><th>Kategori</th>${sizeLabels.map(l=>`<th style="text-align:right;font-size:10px">${l}</th>`).join('')}<th style="text-align:right">Toplam</th></tr></thead>
        <tbody>${Object.entries(catSize).map(([cat,buckets])=>{const total=buckets.reduce((a,b)=>a+b,0);if(total===0)return'';return`<tr><td style="font-weight:500">${badge(cat)}</td>${buckets.map(b=>`<td style="text-align:right;font-variant-numeric:tabular-nums;color:${b>0?'var(--text)':'var(--muted)'}">${b.toLocaleString()||'—'}</td>`).join('')}<td style="text-align:right;font-weight:600">${total.toLocaleString()}</td></tr>`}).join('')}
      </table></div></div>`
  }catch(e){if(!refresh)el.innerHTML=`<div class="empty">${e.message.includes('not available')?'Analiz henüz hazır değil. Agent ilk crawl cycle\'ı tamamlayınca otomatik oluşur.':e.message}</div>`}
}

updateNavStatus()
loadDash()
toggleLive()
</script>
</body>
</html>
